name: Automated Gemini AI Question Generator Cron

on:
  schedule:
    # Eksekusi Harian Setiap Jam 10:00 Pagi WIB (03:00 UTC) -> 50 Soal Baru
    - cron: '0 3 * * *'
  workflow_dispatch: # Memungkinkan eksekusi manual via tombol di GitHub UI

jobs:
  generate-questions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install @google/generative-ai firebase-admin

      - name: Run Gemini AI Question Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          node scripts/ai_question_generator.js
